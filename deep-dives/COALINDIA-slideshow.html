<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COALINDIA — Investment Deep Dive | May 12, 2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111A3E; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; height:100vh; }

  .header {
    background:#111A3E; color:#D6E4FF; padding:10px 16px 8px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid #D97706; position:fixed; top:0; left:0; right:0; z-index:100;
  }
  .header .title { font-size:13px; font-weight:700; color:#fff; }
  .header .sub   { font-size:11px; color:#D97706; margin-top:2px; }
  .header .count { font-size:12px; color:#D6E4FF; font-weight:600; white-space:nowrap; }

  .viewer {
    position:fixed; top:64px; bottom:72px; left:0; right:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  .slides-wrap {
    display:flex; width:100%; height:100%;
    transition:transform 0.35s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }

  .slide {
    min-width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:8px;
  }
  .slide img {
    max-width:100%; max-height:100%;
    object-fit:contain; border-radius:6px;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
  }

  .nav {
    position:fixed; bottom:0; left:0; right:0; height:72px;
    background:#1C2B5E; display:flex; align-items:center;
    justify-content:space-between; padding:0 16px;
    border-top:1px solid #2D5BE3;
  }

  .nav button {
    background:#2D5BE3; color:#fff; border:none; border-radius:8px;
    padding:12px 28px; font-size:15px; font-weight:700; cursor:pointer;
    transition:background .2s; -webkit-tap-highlight-color:transparent;
  }
  .nav button:active { background:#1C2B5E; }
  .nav button:disabled { background:#334155; color:#64748B; cursor:default; }

  .dots {
    display:flex; gap:7px; align-items:center; flex-wrap:wrap;
    justify-content:center; max-width:60%;
  }
  .dot {
    width:8px; height:8px; border-radius:50%;
    background:#334155; cursor:pointer; transition:all .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .dot.active { background:#D97706; transform:scale(1.4); }

  .verdict-badge {
    position:fixed; top:68px; right:10px;
    background:#D97706; color:#fff; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:12px; z-index:99; letter-spacing:0.5px;
  }

  /* Swipe hint */
  .swipe-hint {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    color:#64748B; font-size:11px; pointer-events:none;
    opacity:1; transition:opacity 1s;
  }
  .swipe-hint.hidden { opacity:0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title">COALINDIA — Coal India Limited</div>
    <div class="sub">Investment Deep Dive · May 12, 2026</div>
  </div>
  <div class="count" id="counter">1 / 8</div>
</div>

<div class="verdict-badge">WATCH ⚠</div>

<div class="viewer">
  <div class="slides-wrap" id="wrap">
    <div class="slide"><img src="slide_01_cover.png" alt="Slide 1"></div>
    <div class="slide"><img src="slide_02_verdict.png" alt="Slide 2"></div>
    <div class="slide"><img src="slide_03_overview.png" alt="Slide 3"></div>
    <div class="slide"><img src="slide_04_earnings.png" alt="Slide 4"></div>
    <div class="slide"><img src="slide_05_margins.png" alt="Slide 5"></div>
    <div class="slide"><img src="slide_06_risks.png" alt="Slide 6"></div>
    <div class="slide"><img src="slide_07_valuation.png" alt="Slide 7"></div>
    <div class="slide"><img src="slide_08_analyst.png" alt="Slide 8"></div>
  </div>
</div>

<div class="swipe-hint" id="hint">← swipe to navigate →</div>

<div class="nav">
  <button id="prev" onclick="go(-1)" disabled>‹ Prev</button>
  <div class="dots" id="dots"></div>
  <button id="next" onclick="go(1)">Next ›</button>
</div>

<script>
const total = 8;
let cur = 0;
const wrap = document.getElementById('wrap');
const counter = document.getElementById('counter');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const dotsEl = document.getElementById('dots');
const hint = document.getElementById('hint');

// Build dots
for(let i=0;i<total;i++){
  const d=document.createElement('div');
  d.className='dot'+(i===0?' active':'');
  d.onclick=()=>goTo(i);
  dotsEl.appendChild(d);
}

function goTo(n){
  cur=Math.max(0,Math.min(total-1,n));
  wrap.style.transform=`translateX(-${cur*100}%)`;
  counter.textContent=`${cur+1} / ${total}`;
  prev.disabled=cur===0; next.disabled=cur===total-1;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}

function go(dir){ goTo(cur+dir); }

// Swipe support
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){ go(dx<0?1:-1); }
},{passive:true});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});

// Hide hint after 3s
setTimeout(()=>hint.classList.add('hidden'),3000);
</script>
</body>
</html>
